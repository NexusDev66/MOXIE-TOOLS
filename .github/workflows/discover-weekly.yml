name: Weekly Discover (海外 PH + 国产 curated → pending)

# Phase 3 · 每周发现新锐 AI 工具 → DeepSeek 中文化补全 → 闸门去重 → 写 moxie_products(status=pending)。
# 海外侧:Product Hunt;国产侧:discover-domestic 的 curated 种子(v1 教训:国产自动爬=灰产)。
# 入 pending 后由 refresh.yml 的 promote-candidates(完善度达标自动上架)闭环上线。
#
# 需仓库 Secrets:SUPABASE_SERVICE_ROLE_KEY、DEEPSEEK_API_KEY、PH_CLIENT_ID、PH_CLIENT_SECRET
#        Variables:NEXT_PUBLIC_SUPABASE_URL

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 UTC 02:00 = 北京 10:00
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PH_CLIENT_ID: ${{ secrets.PH_CLIENT_ID }}
      PH_CLIENT_SECRET: ${{ secrets.PH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 海外新锐发现(Product Hunt)→ pending
        run: node cli/discover-tools.js --limit 20 --days 7
        continue-on-error: true

      - name: 国产新锐发现(curated 种子)→ pending
        run: node cli/discover-domestic.js
