name: MOXIE Candidate Auto-Promote

# T11 (MOXIE-24) 完善度阈值自动 promote · 定时侧
#
# 每天 09:00(北京)扫一遍 pending candidates,completeness 分 >= 阈值的自动升级到 products。
# 阈值由部署端 env CANDIDATE_AUTO_PROMOTE_THRESHOLD 控(默认 70);仍保留 admin 人工 promote 兜底。
#
# 配置(不含业务 secret,DB/LLM key 在部署端 Next 服务):
#   - secrets.LATEMAI_INTERNAL_TOKEN  内部 API Bearer token(同 T6/T10)
#   - vars.SITE_BASE_URL              线上根 URL,如 https://latemai.com

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00 = 北京 09:00(早于文章 jobs 的 01:30)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check config
        env:
          TOKEN: ${{ secrets.LATEMAI_INTERNAL_TOKEN }}
          BASE: ${{ vars.SITE_BASE_URL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$BASE" ]; then
            echo "::error::缺 secrets.LATEMAI_INTERNAL_TOKEN 或 vars.SITE_BASE_URL,跳过"
            exit 1
          fi

      - name: Auto-promote candidates
        env:
          TOKEN: ${{ secrets.LATEMAI_INTERNAL_TOKEN }}
          BASE: ${{ vars.SITE_BASE_URL }}
        run: |
          curl -fsS -X POST "$BASE/api/internal/candidates/auto-promote" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" | tee /tmp/auto-promote.json
          echo
