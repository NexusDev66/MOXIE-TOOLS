name: (临时) 测试更多快讯源

# 仅手动触发,dry-run 看候选 AI 源在 Actions 的可达性 + 样本标题判断相关度。验完即删。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWS_FEEDS: "https://www.qbitai.com/feed|量子位,https://www.leiphone.com/feed|雷锋网,https://www.infoq.cn/feed|InfoQ,https://rsshub.app/jiqizhixin|机器之心,https://www.pingwest.com/feed|品玩,https://www.ithome.com/rss/|IT之家"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: dry-run 抓取(看每源条数 + 样本标题)
        run: node cli/fetch-news.js --dry-run --limit 50
