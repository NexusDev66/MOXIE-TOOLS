name: MOXIE Trend Scanner

on:
  schedule:
    # 每周一 UTC 00:00 = 北京时间周一早 8 点
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 允许手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'   # 提前用 Node 24，去 deprecation warning
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run trend scanner
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}   # AC-4 告警 webhook，未配则 scanner 只 log
        run: node cli/trend-scanner.js

      - name: Show DB stats
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s "https://sqvohgcwzhhsvkmyesvs.supabase.co/rest/v1/moxie_trend_candidates?select=count" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" -I 2>/dev/null | grep -i content-range || true
