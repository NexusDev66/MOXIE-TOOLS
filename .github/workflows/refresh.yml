name: Daily Refresh (rank + prerender + sitemap)

# Phase 2.4 / 1.4 · 每天自动:重算权重 → 重渲染产品/文章页 → 重生成 sitemap → 提交。
# 提交推送后 Vercel 自动重新部署,站点保持最新。
#
# 需要在 仓库 Settings → Secrets and variables → Actions 配:
#   Secrets:  SUPABASE_SERVICE_ROLE_KEY   (写库,sb_secret_...)
#   Variables: NEXT_PUBLIC_SUPABASE_URL    (https://kyiqgvxvbxktiygohuqh.supabase.co)
#              NEXT_PUBLIC_SUPABASE_ANON_KEY (sb_publishable_...,公开)
#              SITE_BASE_URL               (上线域名,如 https://moxie-main-shiyan.vercel.app)

on:
  schedule:
    - cron: '0 18,22,2,6,10,14 * * *'  # 每 4 小时一次,北京 02/06/10/14/18/22(UTC 18/22/02/06/10/14):每天凌晨2点起滚动上新
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许提交回仓库

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      PH_CLIENT_ID: ${{ secrets.PH_CLIENT_ID }}            # Product Hunt 发现用(没配则发现步骤跳过)
      PH_CLIENT_SECRET: ${{ secrets.PH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查配置
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::缺 NEXT_PUBLIC_SUPABASE_URL 或 SUPABASE_SERVICE_ROLE_KEY(仓库 Settings → Actions secrets/variables)"
            exit 1
          fi

      - name: 抓取每日 AI 快讯(RSS→moxie_news,源失败不阻塞)
        run: node cli/fetch-news.js
        continue-on-error: true

      - name: 快讯打分+分类+中文摘要(只处理新抓的,失败不阻塞)
        run: node cli/score-news.js
        continue-on-error: true

      - name: 拉 Tranco 流量排名(权重真信号,失败不阻塞)
        run: node cli/fetch-traffic.js
        continue-on-error: true

      - name: 抽取名人观点(快讯→moxie_voices,失败不阻塞)
        run: node cli/extract-voices.js
        continue-on-error: true

      - name: 发现海外新锐 AI 工具(Product Hunt 高票 → pending,失败不阻塞)
        run: node cli/discover-tools.js --limit 150 --days 21
        continue-on-error: true

      - name: 发现新锐 AI 工具(Hacker News「Show HN」高赞,免凭据兜底 → pending,失败不阻塞)
        run: node cli/discover-hn.js --limit 80 --days 21 --min-points 10
        continue-on-error: true

      - name: 发现一手新品(Uneed 官方接口·每日上新榜,真域名+简介+logo → pending,失败不阻塞)
        run: node cli/discover-uneed.js --days 21 --limit 80
        continue-on-error: true

      - name: 发现一手新品(MarketingDB 官方接口·上新榜,真域名+标语+logo → pending,失败不阻塞)
        run: node cli/discover-marketingdb.js --limit 60
        continue-on-error: true

      - name: 发现一手新品(trylaunch.ai 官方接口·vibe coder AI 产品,真域名+图标 → pending,失败不阻塞)
        run: node cli/discover-trylaunch.js --limit 60
        continue-on-error: true

      - name: 发现新锐 AI 工具(厂商自助发布平台 sitemap:microlaunch/saascity/foundrlist,免凭据 → pending,失败不阻塞)
        run: node cli/discover-sitemap.js --limit 80
        continue-on-error: true

      - name: 发现国产 AI 工具(魔搭创空间·官方机构高访问量 → pending,国内直连,失败不阻塞)
        run: node cli/discover-modelscope.js --limit 30 --min-visits 30000 --pages 5
        continue-on-error: true

      - name: 发现开源 AI 工具(GitHub·带官网的现实星数区间,砍刷星 → pending,失败不阻塞)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cli/discover-github.js --limit 20 --min-stars 120 --max-stars 6000 --days 365
        continue-on-error: true

      - name: 厂商提交质量闸(对手填 pending 过 screen:套壳/灰产/非AI 转 rejected,通过的盖 submission_screened,失败不阻塞)
        run: node cli/screen-submissions.js
        continue-on-error: true

      - name: 新候选详情清洗(给无 detail 的 pending 补 features,达标才能被上架,失败不阻塞)
        run: node cli/enrich-detail.js
        continue-on-error: true

      - name: 候选自动上架(完善度达标的 pending → published,留底仓防放干,直连DB,失败不阻塞)
        run: node cli/promote-candidates.js --limit 12 --reserve 40
        continue-on-error: true

      - name: 重算权重(rank)
        run: node cli/rank.js

      # 「子墨测过」改为纯人工标记(后台 moxie-admin 改 verified):不再按权重自动发徽章,
      # 否则新发现工具一进小分类前10就被误标"测过"。verified-rank.js 保留但移出流水线。

      - name: 价格档补全(不详→定性档,绝不编金额;实在没把握留不详,失败不阻塞)
        run: node cli/fix-prices.js
        continue-on-error: true

      - name: 国内可用性补全(不详→是/需代理/否,海外默认需代理,失败不阻塞)
        run: node cli/fix-domestic.js
        continue-on-error: true

      - name: 综合风评 补缺(非 verified 产品,客观风评,失败不阻塞)
        run: node cli/gen-fengping.js
        continue-on-error: true

      - name: 生成文章封面(补缺,无 API 成本)
        run: node cli/gen-covers.js
        continue-on-error: true

      - name: 补全工具 logo(抓官网图标自托管,新品不再首字母占位,失败不阻塞)
        run: node cli/gen-logos.js
        continue-on-error: true

      - name: 生成同源数据快照(public/data/snapshot.json · 大陆免连 Supabase 看数据)
        run: node cli/snapshot.js
        continue-on-error: true

      - name: 重渲染产品/文章页(prerender)
        run: node cli/prerender.js

      - name: 重生成 sitemap + robots
        run: node cli/sitemap.js

      - name: IndexNow 提交(Bing/Yandex 加速收录,失败不阻塞)
        run: node cli/indexnow.js
        continue-on-error: true

      - name: 有变化则提交(触发 Vercel 重部署)
        run: |
          git config user.name "moxie-bot"
          git config user.email "507577406@qq.com"
          git rm -r --quiet --ignore-unmatch news/ 2>/dev/null || true   # /news/<id> 详情页已取消,清掉旧目录
          git add tools/ articles/ public/covers/ public/logos/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "无变化,跳过提交"
          else
            git commit -m "chore(refresh): 每日重算权重 + 重渲染 + sitemap"
            # 并发的 refresh / backfill 也会 push main;推前先 rebase,撞上了重试,避免本轮 fail
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 撞车,重试 $i"; sleep $((RANDOM % 8 + 3))
            done
          fi

      - name: 同步到 GitHub Pages 站(nexusdev66.github.io · 大陆可访问)
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          PAT="$(printf '%s' "$PAGES_PAT" | tr -d '[:space:]')"   # 去掉粘贴时混入的空格/换行,防 URL malformed
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/NexusDev66/nexusdev66.github.io.git" /tmp/pages
          cp moxie-*.html moxie-styles.css moxie-shared.js moxie-supabase.js sitemap.xml robots.txt 5e9f4171e1f9473b239b0b0b698d5585.txt /tmp/pages/ 2>/dev/null || true
          cp moxie-preview.html /tmp/pages/index.html
          rm -rf /tmp/pages/public /tmp/pages/tools /tmp/pages/articles /tmp/pages/news
          cp -r public tools articles /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "moxie-bot"
          git config user.email "bot@latemai.local"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages 站无变化"
          else
            git commit -m "sync: 来自 moxie-main 每日刷新"
            for i in 1 2 3 4; do
              git push && break
              echo "Pages push 撞车,重试 $i"; git pull --rebase --autostash; sleep $((RANDOM % 8 + 3))
            done
          fi
