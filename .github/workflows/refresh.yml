name: Daily Refresh (rank + prerender + sitemap)

# Phase 2.4 / 1.4 · 每天自动:重算权重 → 重渲染产品/文章页 → 重生成 sitemap → 提交。
# 提交推送后 Vercel 自动重新部署,站点保持最新。
#
# 需要在 仓库 Settings → Secrets and variables → Actions 配:
#   Secrets:  SUPABASE_SERVICE_ROLE_KEY   (写库,sb_secret_...)
#   Variables: NEXT_PUBLIC_SUPABASE_URL    (https://kyiqgvxvbxktiygohuqh.supabase.co)
#              NEXT_PUBLIC_SUPABASE_ANON_KEY (sb_publishable_...,公开)
#              SITE_BASE_URL               (上线域名,如 https://moxie-main-shiyan.vercel.app)

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00 = 北京 09:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许提交回仓库

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查配置
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::缺 NEXT_PUBLIC_SUPABASE_URL 或 SUPABASE_SERVICE_ROLE_KEY(仓库 Settings → Actions secrets/variables)"
            exit 1
          fi

      - name: 抓取每日 AI 快讯(RSS→moxie_news,源失败不阻塞)
        run: node cli/fetch-news.js
        continue-on-error: true

      - name: 快讯打分+分类+中文摘要(只处理新抓的,失败不阻塞)
        run: node cli/score-news.js
        continue-on-error: true

      - name: 拉 Tranco 流量排名(权重真信号,失败不阻塞)
        run: node cli/fetch-traffic.js
        continue-on-error: true

      - name: 抽取名人观点(快讯→moxie_voices,失败不阻塞)
        run: node cli/extract-voices.js
        continue-on-error: true

      - name: 候选自动上架(完善度达标的 pending → published,直连DB,失败不阻塞)
        run: node cli/promote-candidates.js
        continue-on-error: true

      - name: 重算权重(rank)
        run: node cli/rank.js

      - name: 子墨测过 收口(每分类前10,只增不减·累计)
        run: node cli/verified-rank.js
        continue-on-error: true

      - name: 综合风评 补缺(非 verified 产品,客观风评,失败不阻塞)
        run: node cli/gen-fengping.js
        continue-on-error: true

      - name: 生成文章封面(补缺,无 API 成本)
        run: node cli/gen-covers.js
        continue-on-error: true

      - name: 重渲染产品/文章页(prerender)
        run: node cli/prerender.js

      - name: 重生成 sitemap + robots
        run: node cli/sitemap.js

      - name: IndexNow 提交(Bing/Yandex 加速收录,失败不阻塞)
        run: node cli/indexnow.js
        continue-on-error: true

      - name: 有变化则提交(触发 Vercel 重部署)
        run: |
          git config user.name "moxie-bot"
          git config user.email "507577406@qq.com"
          git add tools/ articles/ news/ public/covers/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "无变化,跳过提交"
          else
            git commit -m "chore(refresh): 每日重算权重 + 重渲染 + sitemap"
            git push
          fi

      - name: 同步到 GitHub Pages 站(nexusdev66.github.io · 大陆可访问)
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          PAT="$(printf '%s' "$PAGES_PAT" | tr -d '[:space:]')"   # 去掉粘贴时混入的空格/换行,防 URL malformed
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/NexusDev66/nexusdev66.github.io.git" /tmp/pages
          cp moxie-*.html moxie-styles.css moxie-shared.js moxie-supabase.js sitemap.xml robots.txt 5e9f4171e1f9473b239b0b0b698d5585.txt /tmp/pages/ 2>/dev/null || true
          cp moxie-preview.html /tmp/pages/index.html
          rm -rf /tmp/pages/public /tmp/pages/tools /tmp/pages/articles /tmp/pages/news
          cp -r public tools articles news /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "moxie-bot"
          git config user.email "bot@latemai.local"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages 站无变化"
          else
            git commit -m "sync: 来自 moxie-main 每日刷新"
            git push
          fi
