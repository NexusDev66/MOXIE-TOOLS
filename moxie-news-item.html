<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="public/moxie-mark.png?v=20260525-01">
<title>每日 AI 快讯 · MOXIE</title>
<meta name="description" content="MOXIE 每日 AI 快讯热闻 · 实时聚合量子位、雷锋网等中文 AI 媒体,带摘要总结与原文直达。">
<link rel="stylesheet" href="/public/fonts/moxie-fonts.css?v=20260611-01">
<link rel="stylesheet" href="moxie-styles.css?v=20260612-05">
<style>
  .nv{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .nv .container{display:flex;align-items:center;justify-content:space-between}
  .nv a.brand{font-weight:600;color:var(--ink);text-decoration:none;font-size:16px}
  .ni-wrap{max-width:720px;margin:0 auto;padding:56px 20px 90px}
  .ni-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
  .ni-src{color:#F53F3F;font-weight:600}
  .ni-wrap h1{font-size:28px;line-height:1.45;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:22px}
  .ni-sum{font-size:15.5px;line-height:1.9;color:var(--ink-1);background:var(--bg-soft);border-radius:12px;padding:20px 22px;margin-bottom:28px}
  .ni-sum.empty{color:var(--ink-3)}
  .ni-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ni-orig{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:11px 22px;border-radius:9999px;font-size:14px;font-weight:500}
  .ni-orig:hover{background:var(--accent-d)}
  .ni-back{color:var(--ink-2);text-decoration:none;font-size:13px}
  .ni-back:hover{color:var(--accent)}
  .ni-note{margin-top:30px;font-size:12px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<nav class="nv"><div class="container">
  <a class="brand" href="/">MOXIE</a>
  <a class="ni-back" href="/moxie-news">← 全部快讯</a>
</div></nav>

<div class="ni-wrap" id="niWrap">
  <div style="padding:80px 0;text-align:center;color:var(--ink-3);font-size:13px;">加载中…</div>
</div>

<script>
  /* 自包含:直接 fetch Supabase REST(公开 anon key,与 moxie-supabase.js 同),不依赖任何外部脚本时序 */
  (function(){
    var SB_URL = 'https://kyiqgvxvbxktiygohuqh.supabase.co';
    var SB_ANON = 'sb_publishable_QDAR-tJjJpV4jpeDOAt76w_xoEwfHma';
    var wrap = document.getElementById('niWrap');
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function fdate(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d)) return ''; return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
    function fail(msg){ wrap.innerHTML = '<div style="padding:70px 0;text-align:center;color:var(--ink-3);font-size:13px;">'+msg+'<br><a href="/moxie-news" style="color:var(--accent);">← 回快讯列表</a></div>'; }
    var id = new URLSearchParams(location.search).get('id') || (location.pathname.match(/\/news\/([^/?#]+)/) || [])[1];
    if(!id){ fail('缺少快讯 id'); return; }
    fetch(SB_URL + '/rest/v1/moxie_news?id=eq.' + encodeURIComponent(id) + '&select=id,title,url,source,tag,published_at,summary&limit=1', {
      headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON }
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(arr){
      var n = arr && arr[0];
      if(!n){ fail('这条快讯可能已下架(id=' + esc(id) + ')'); return; }
      document.title = n.title + ' · MOXIE 快讯';
      var sum = (n.summary||'').trim();
      wrap.innerHTML =
        '<div class="ni-meta"><span class="ni-src">'+esc(n.source||n.tag||'')+'</span><span>·</span><span>'+esc(fdate(n.published_at))+'</span><span>·</span><span>AI 快讯</span></div>'
        + '<h1>'+esc(n.title)+'</h1>'
        + '<div class="ni-sum'+(sum?'':' empty')+'">'+(sum?esc(sum):'本条快讯暂无摘要,点下方阅读原文。')+'</div>'
        + '<div class="ni-actions"><a class="ni-orig" href="'+esc(n.url)+'" target="_blank" rel="noopener">阅读原文 ↗</a><a class="ni-back" href="/moxie-news">← 全部快讯</a></div>'
        + '<div class="ni-note">摘要来自来源媒体('+esc(n.source||'')+')的公开 RSS,版权归原作者。MOXIE 仅做聚合索引,完整内容请以原文为准。</div>';
    }).catch(function(e){ fail('加载失败:' + (e && e.message || e)); });
  })();
</script>
</body>
</html>
